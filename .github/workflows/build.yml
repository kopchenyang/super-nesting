name: 自动构建Win7兼容exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: 安装 Python 3.8 (Win7兼容)
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: 安装依赖
        run: pip install PyQt5 pyinstaller

      - name: 构建exe
        run: pyinstaller --name=SuperNesting --windowed --onefile --clean --win-private-assemblies main.py

      - name: 上传成品
        uses: actions/upload-artifact@v4
        with:
          name: SuperNesting-Win7
          path: dist/SuperNesting.exe
